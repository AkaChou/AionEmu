name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and package server
        run: bash scripts/package.sh

      - name: Compress aion folder to 7z
        run: |
          if ! command -v 7z &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y p7zip-full
          fi
          7z a -mx=9 aion.7z ./aion

      - name: Generate changelog and publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Date-based tag with a same-day sequence: v20261014, v20261014-1, ...
          DATE="$(date +'%Y%m%d')"
          N=0
          TAG="v$DATE"
          while git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; do
            N=$((N + 1))
            TAG="v$DATE-$N"
          done
          echo "Releasing $TAG"

          PREV_TAG="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n 1 || true)"
          echo "Previous tag: ${PREV_TAG:-<none>}"

          # Highlights only: added/fixed items, capped. The full list stays in git.
          PREV_TAG="$PREV_TAG" TAG="$TAG" python3 - <<'PY'
          import os, re, subprocess

          prev = os.environ.get("PREV_TAG", "")
          tag = os.environ["TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          MAX_ITEMS, MAX_SUBJECT, BUDGET = 10, 90, 8000

          rev = f"{prev}..HEAD" if prev else "HEAD"
          log = subprocess.run(
              ["git", "log", rev, "--no-merges", "--pretty=format:%s"],
              capture_output=True, text=True, check=True,
          ).stdout
          subjects = [line for line in log.splitlines() if line.strip()]

          counts = {}
          buckets = {"Added": [], "Fixed": []}
          for subject in subjects:
              m = re.match(r"^([a-z]+)(\(([^)]*)\))?!?:\s*(.*)$", subject)
              kind, scope, text = (m.group(1), m.group(3) or "", m.group(4)) if m else ("", "", subject)
              counts[kind or "other"] = counts.get(kind or "other", 0) + 1
              title = "Added" if kind == "feat" else "Fixed" if kind == "fix" else None
              if title is None:
                  continue
              label = f"{scope}: {text}" if scope else text
              if len(label) > MAX_SUBJECT:
                  label = label[: MAX_SUBJECT - 3].rstrip() + "..."
              buckets[title].append(f"- {label}")

          out = [f"## {len(subjects)} change(s)", ""]
          if prev:
              compare = f"https://github.com/{repo}/compare/{prev}...{tag}"
              out += [f"Since `{prev}` — [full comparison]({compare}).", ""]
          truncated = False
          for title in ("Added", "Fixed"):
              items = buckets[title]
              if not items:
                  continue
              kept = items[:MAX_ITEMS]
              if len(items) > MAX_ITEMS:
                  kept.append(f"- _... and {len(items) - MAX_ITEMS} more_")
                  truncated = True
              out += [f"### {title}", ""] + kept + [""]

          others = ", ".join(f"{k}: {v}" for k, v in sorted(counts.items())
                             if k not in ("feat", "fix") and k)
          if others:
              out += [f"Other commits — {others}.", ""]
          if truncated:
              out += ["_Highlights only._", ""]

          body = "\n".join(out)
          if len(body) > BUDGET:
              body = body[:BUDGET] + "\n\n_Highlights only; see the git history for the rest._\n"
          open("RELEASE_NOTES.md", "w", encoding="utf-8").write(body)
          print(f"Notes: {len(body)} chars")
          PY

          gh release create "$TAG" aion.7z \
            --title "Release $TAG" \
            --notes-file RELEASE_NOTES.md
