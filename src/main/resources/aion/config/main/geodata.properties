# 地理数据配置 / Geodata config's:

# 启用地理数据（高度与网格）
# Enable Geodata (heights and meshes)
# 默认值: true / Default: true
gameserver.geodata.enable = true

# 启用基于地理数据的 canSee 检测
# Enable canSee checks using geodata.
# 默认值: true / Default: true
gameserver.geodata.cansee.enable = true

# 启用基于地理数据的恐惧技能
# Enable fear skill using geodata.
# 默认值: true / Default: true
gameserver.geodata.fear.enable = true

# 若启用 - 移动时 NPC 在目标飞行时将基于地理数据检查 Z 坐标
# If enabled - during movements npcs will be checking z coordinate based on geo if target is flying
# 默认值: true / Default: true
gameserver.geo.npc.move = true

# 启用更平滑但成本更高的 NPC 回家移动（寻路失败超时、平滑路点和 GEO 高度校正）
# Enable smoother but more expensive NPC home-return movement (failure timeout, smooth waypoints and GEO height correction)
# 默认值: true / Default: true
gameserver.ai.home.return.enhanced.enable = true

# 启用使用技能的地理材料
# Enable geo materials using skills
# 默认值: false / Default: false
gameserver.geo.materials.enable = true

# 启用地理数据护盾，用于测试
# Enable geodata shields, for test purpose
# 默认值: false / Default: false
gameserver.geo.shields.enable = false

# 真实 path.dat 寻路
gameserver.geo.path.enable = true
# 按 NPC 与玩家距离降低非战斗移动和追击重寻频率；默认关闭
gameserver.geo.path.distance.tiers.enable = true
gameserver.geo.path.recovery.enable = true
# 跨至少 8 个 PATH block 的长路径先走分层 block 走廊，失败自动回退普通 A*
gameserver.geo.path.hierarchical.enable = true
gameserver.geo.path.waypoint.lookahead = 3

# 行走 NPC（巡逻）沿 Path 推进模式：off=关闭（与旧行为逐分支等价）；blocked=仅当航段直线不可达时
# 沿 Path（PATH-LoS 失败才异步预取）；always=所有航段沿 Path（实机 A/B 用）。真端语义：航点之间用
# Path 连通图连接而不是直线。
# Walker along-Path mode: off = disabled (matches the old straight-line behaviour); blocked = only legs
# whose straight line is unreachable; always = every leg (for live A/B).
gameserver.geo.npc.walk.path.mode = blocked

# 行走 NPC 每步碰撞/步高抬升解算（真端：线段碰撞查询 + 按步高抬升 + 向下打地面装回面上）
# Per-step walker collision / step-height lift resolution (retail: segment collision + lift + ground probe)
gameserver.geo.npc.walk.collision.enable = true

# 行走路线装载校验：off=关闭（默认）；log=只记录不改数据（输出需要沿 Path 的段与问题段清单）；
# enforce=按世界生成净化副本（截断超长/不可达段、闭环去重），随后续切片实现
# Walker route load-time validation: off = disabled (default); log = record only; enforce = per-world sanitized copy
gameserver.geo.npc.walk.route.validate = off

# 行走路线校验汇总日志开关：开启时按（世界，路线）打印一次统计汇总（步数/需沿 Path 段数/问题数）
# Walker route validation summary log: one per-(world, route) statistics line when enabled; off by default
gameserver.geo.npc.walk.route.validate.summary.enable = false

# 按需映射并保留的 PATH 地图数；多图/副本建议 ≥ 活跃地图数，0=不限制
gameserver.geo.path.cache.size = 32

# 单次 A* 最多展开的节点数
gameserver.geo.path.max.nodes = 50000

# 飞行/游泳三维网格步长（米）与单次请求超时（毫秒）
gameserver.geo.path.spatial.step = 2
gameserver.geo.path.timeout.ms = 250

# 寻路 worker 数；0=按 CPU 自动（最多 8）
gameserver.geo.path.workers = 0

# 异步寻路队列容量
gameserver.geo.path.queue.capacity = 256
