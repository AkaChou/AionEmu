# 军团配置

# 军团配置 / Legions Config:

# 字符模式：
# Character Patterns:
# 启用 UTF 支持 - 将此参数设为 [a-zA-ZА-Яа-я]{2,32}
# To enable UTF support - set this parameter to [a-zA-ZА-Яа-я]{2,32}
gameserver.legion.pattern = [a-zA-Z[\\u4E00-\\u9FA5]]{2,32}
gameserver.legion.self.intro.pattern = .{1,32}
gameserver.legion.nick.name.pattern = .{1,10}
gameserver.legion.announcement.pattern = .{1,256}

# 解散设置：
# Disband Settings:
gameserver.legion.disband.time = 600

# 启用升级时的“军团任务”要求
# Enable "Legion Task" requirement for level up
# 默认值: true / Default: true
gameserver.legion.task.requirement.enable = true

# 军团创建设置：
# Legion Creation Settings:
gameserver.legion.creation.required.kinah = 10000

# 军团徽章设置：
# Legion Emblem Settings:
gameserver.legion.emblem.required.kinah = 10000

