# 候选任务 shadow 诊断开关。旧 Handler/XML 始终是唯一生产 owner，候选定义不会执行任何副作用。
# Candidate-only quest shadow diagnostics. Legacy Handler/XML remains the sole production owner.
# 默认关闭；仅在运维人员明确开始一个限定 owner 的生产观察周期时启用。
# Disabled by default; enable only for an intentional, bounded production observation run.
gameserver.quest.shadow.enable = false

# 累积式、经过 schema 严格校验的报告路径；服务器重启后会继续合并兼容的已有报告。
# Cumulative, schema-validated report path; a compatible report is resumed after restart.
gameserver.quest.shadow.report.path = ./log/quest-shadow/unified-shadow-report.json

# 报告持久化周期（秒）。默认每五分钟保存 owner、路径和 dispatch contract 累积证据。
# Persistence interval in seconds. The default stores accumulated owner/path/dispatch-contract evidence every five minutes.
gameserver.quest.shadow.persist.interval.seconds = 300
