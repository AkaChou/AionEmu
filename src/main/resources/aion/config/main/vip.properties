# 自动为所有账号补齐独立 VIP 数据。 / Automatically add independent VIP data for every account.
loginserver.vip.auto-enable = false

# 仅为缺少 account_vip 记录的账号设置此 VIP 等级（1-6）。
# Assign this VIP level only to accounts without an account_vip row (1-6).
loginserver.vip.auto-enable.level = 1

# China-client VIP stage UI (角色选择“会员阶段”) uses STS /Level/GetLevel.
# This is independent from account_data.membership and from SM_CHAR_BM_PACK_LIST.
loginserver.vip.sts.enable = true
loginserver.vip.sts.host = *
loginserver.vip.sts.port = 6600
loginserver.vip.sts.app-group = AION
# Used only when account_vip is missing. Prefer DB vip_exp / vip_level.
loginserver.vip.sts.default-score = 0
