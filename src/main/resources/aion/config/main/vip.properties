# 自动为所有账号补齐独立 VIP 数据。 / Automatically add independent VIP data for every account.
loginserver.vip.auto-enable = false

# 仅为缺少 account_vip 记录的账号设置此 VIP 等级（1-6）。
# Assign this VIP level only to accounts without an account_vip row (1-6).
loginserver.vip.auto-enable.level = 1

# TODO: STS 服务尚未实现完成，默认禁用，仅用于联调。
# TODO: STS is not fully implemented; disabled by default and intended for integration testing only.
loginserver.vip.sts.enable = false
loginserver.vip.sts.host = *
loginserver.vip.sts.port = 6600
