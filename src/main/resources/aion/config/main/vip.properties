# 自动为所有账号（已有或新增）授予独立 VIP，默认开启；已有记录会被提升到下面的等级与有效期。
# Automatically grant independent VIP to every account (existing or new), enabled by default; existing rows are upgraded to the level and validity below.
loginserver.vip.auto-enable.value = true

# 授予的 VIP 等级（1-6），默认最高档。
# VIP level granted (1-6), defaults to the highest tier.
loginserver.vip.auto-enable.level = 6

# 授予的 VIP 有效期天数（自登录服启动时刻起算）。
# Validity in days for the granted VIP (counted from login server startup).
loginserver.vip.auto-enable.days = 365
