# 物品强化基础成功率（%）:
# Item enchant base success rate (%):
# 默认值: 100 / Default: 100
gameserver.enchant.item.success.rate = 100

# 羽饰觉醒成功率（%）:
# Plume tempering success rate (%):
# 默认值: 100 / Default: 100
gameserver.enchant.plume.success.rate = 100

# 手镯觉醒成功率（%）:
# Bracelet tempering success rate (%):
# 默认值: 100 / Default: 100
gameserver.enchant.bracelet.success.rate = 100

# 饰品觉醒成功率（%）（耳环/戒指/项链/头盔/腰带）:
# Accessory tempering success rate (%) (earrings/rings/necklace/helmet/belt):
