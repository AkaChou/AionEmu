# 强化配置:
# ENCHANT CONFIG:

# 统一强化物品基纳消耗:
# Unified Enchant Item Kinah:
# 默认值: -1（使用当前品质/等级价格表） / Default: -1 (use current quality/level price table)
gameserver.enchant.item.kinah = 20000

# 装备最大强化等级:
# Max Equipment Enchant Level:
# 默认值: 50，上限 200（超出按 200 计） / Default: 50
gameserver.enchant.equipment.max.level = 50

# 天烙之石（埃斯蒂玛）最大强化等级:
# Max Estima (CP Stone) Enchant Level:
# 默认值: 15，上限 100（超出按 100 计，非正数回退到 15）
# Default: 15, capped at 100; non-positive values fall back to 15
gameserver.enchant.estima.max.level = 15


# 首饰最大觉醒等级（耳环/戒指/项链/头盔/腰带）:
# Max Authorize Level for Accessories (earrings/rings/necklace/helmet/belt):
# 默认值: 30，上限 200（超出按 200 计） / Default: 30, capped at 200
gameserver.enchant.authorize.accessory.max.level = 50

# 羽饰最大觉醒等级:
# Max Authorize Level for Plumes:
# 默认值: 30，上限 200（超出按 200 计） / Default: 30, capped at 200
gameserver.enchant.authorize.plume.max.level = 30

# 手镯最大觉醒等级:
# Max Authorize Level for Bracelets:
# 默认值: 30，上限 200（超出按 200 计） / Default: 30, capped at 200
gameserver.enchant.authorize.bracelet.max.level = 30

# 天烙之石强化基础成功率（%），不随强化等级变化，0 为必败，100 为必成:
# Estima Enchant Base Success Rate (%), independent of level; 0 always fails, 100 always succeeds:
# 注意: 使用子键 value 形式，避免与 max/speed 子键冲突；裸标量形式仅作向后兼容
# Note: use the value sub-key form to avoid conflicts with max/speed sub-keys; bare scalar is backward compatible
# 默认值: 30 / Default: 30
gameserver.enchant.estima.value=30# 魔石镶嵌基础成功率（%）:

# Manastone socketing base success rate (%):
# 默认值: 100 / Default: 100
gameserver.socket.manastone = 100

# 物品强化基础成功率（%）:
# Item enchant base success rate (%):
# 注意: 使用子键 value 形式，避免与 kinah/broke 子键冲突；裸标量形式仅作向后兼容
# Note: use the value sub-key form to avoid conflicts with kinah/broke sub-keys; bare scalar kept for backward compatibility
# 默认值: 100 / Default: 100
gameserver.enchant.item.value = 100

# 羽饰觉醒成功率（%）:
# Plume tempering success rate (%):
# 默认值: 100 / Default: 100
gameserver.enchant.plume = 100

# 手镯觉醒成功率（%）:
# Bracelet tempering success rate (%):
# 默认值: 100 / Default: 100
gameserver.enchant.bracelet = 100

# 饰品觉醒成功率（%）（耳环/戒指/项链/头盔/腰带）:
# Accessory tempering success rate (%) (earrings/rings/necklace/helmet/belt):
# 默认值: 100 / Default: 100
gameserver.enchant.accessory = 100

# 烙印之石强化成功率（%）:
# Stigma enchant success rate (%):
# 默认值: 100 / Default: 100
gameserver.enchant.stigma = 100

# 强化施法速度物品:
# Enchant Cast Speed Item:
# 默认值: 4000 / Default: 4000
gameserver.enchant.cast.speed = 500

# 觉醒（淬炼）施法速度:
# Authorize (Tempering) Cast Speed:
# 默认值: 3000，觉醒加速生效时取一半 / Default: 3000, halved while authorize boost is active
gameserver.enchant.authorize.speed = 500
# 天烙之石强化施法速度（毫秒）:
# Estima Enchant Cast Speed (milliseconds):
# 默认值: 5000 / Default: 500
gameserver.enchant.estima.speed=500

# 清理镶嵌过载魔力石的物品
# Clean items with overloaded manastones
# 默认值: false / Default: false
gameserver.manastone.clean = false
