# 游戏服务器主配置

# 游戏服务器配置 / GS config's:

# 服务器国家代码
# Server: Country Code
# 韩国 KR: 0
# 北美 NA: 1
# 欧洲 EU: 2
# 日本 JAP: 4
# 盛大/国服 SDO / CN: 5
# 俄罗斯 RUS: 7
# 自动适配 AUTO: 99（按系统 Locale 映射）
# 默认值: 99 / Default: 99
gameserver.country.code = 99

# 启用聊天服务器连接
# Enable chat server connection
# 默认值: true / Default: true
gameserver.chatserver.enable = true

# 启用游戏服务器管理面板（无需进游戏即可执行命令：shutdown, who, online, add, prison, announce）
# Enable displaying admin panel for game server - to not go in game(commands: shutdown, who, online, add, prison, announce)
# 默认值: false / Default: false
gameserver.yaadminpanel.server.enable = false

# 服务器模式 / Server mode:

# 每个账号可创建的角色数量（仅可填 0-8 的数值）
# Game server user can create a number of characters per account (Only enter numeric value between 0-8)
# 默认值: 5 / Default: 5
gameserver.character.limit.count = 8

# 角色删除倒计时（分钟）
# Character deletion countdown (minutes)
# 设为 0 可立即进入可删除状态，负数按 0 处理
# Set to 0 to make the character immediately eligible for deletion; negative values are treated as 0
# 默认值: 10 / Default: 10
gameserver.character.delete.delay.minutes = 10

# 角色创建模式（仅可填 0-2 的数值）
# Related to the character creation mode (Only enter numeric value between 0-2)
# 0: 同一账号不能创建双阵营角色 / user can't create characters from both factions at the same account
# 1: 同一账号可创建双阵营角色 / user can create characters from both factions at the same account
# 2: 绑定阵营，最多 2 个角色且无法进入游戏世界（角色预留模式） / user is bound to a faction, can't create more than 2 characters and can't enter the game world (character reservation mode)
# 默认值: 0 / Default: 0
gameserver.character.creation.mode = 1

# 自定义转职等级 / Custom Level to Change Class

# 玩家最大等级 5.8
# Max level for players 5.8
# 实际: 75 / Actual: 75
# 自定义: 83 / Custom: 83
gameserver.players.max.level = 83

# 比例配置 / Ratio's configs:

# 与角色创建模式相关的阵营限制（仅可填 0-3 的数值）
# Related to the character creation mode (Only enter numeric value between 0-3)
# 0: 所有种族都可创建角色 / All races can create a character
# 1: 限制天族角色创建 / Elyos character creation limit
# 2: 限制魔族角色创建 / Asmodians character creation limit
# 3: 所有种族创建角色均受限 / All races create a character limit
# 默认值: 0 / Default: 0
gameserver.character.faction.limitation.mode = 0

# 启用阵营比例限制
# Enable ratios limitation
# 默认值: false / Default: false
gameserver.ratio.limitation.enable = true

# 计入比例计算的最低角色等级
# Minimum character level to take into account in ratio calculation
# 默认值: 10 / Default: 10
gameserver.ratio.min.required.level = 10

# 开始限制比例前，各阵营所需的最低角色数
# Minimum characters count in each faction needed before limiting ratios
# 默认值: 50 / Default: 50
gameserver.ratio.min.characters_count = 50

# 真实游戏服务器时区 ID（用于修正夏令时偏移）
# Real GameServer Time Zone ID (to fix Daylight Saving offsets)
# 现使用 Java Time API (java.time) 替代 Joda-Time
# Now using Java Time API (java.time) instead of Joda-Time
# 可用时区列表: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
# List of available time zones: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
# 常用值: Europe/Moscow, Europe/Samara, Europe/Kaliningrad, Asia/Yekaterinburg 等
# Common values: Europe/Moscow, Europe/Samara, Europe/Kaliningrad, Asia/Yekaterinburg, etc.
# 也支持 GMT/UTC 偏移，如 GMT+04:00 或 UTC+04:00
# Also supports GMT/UTC offsets like GMT+04:00 or UTC+04:00
# 默认值: 空（使用系统默认时区） / Default: empty (uses system default time zone)
gameserver.timezone = Asia/Shanghai

# 为欧比斯排名启用较小缓存
# Enable smaller cache for abyss ranking
# 推荐用于缓存时间较长的大型服务器
# Recommended for big servers with long caching duration
# 默认值: false / Default: false

gameserver.abyssranking.small.cache = false

# 静态数据进度条目计数
# Static data progress entry counts
# 默认禁用，避免在 JAXB 加载前扫描完整 static_data.xml
# Disabled by default to avoid scanning the full static_data.xml before JAXB loading
# 默认值: false / Default: false

gameserver.static_data.progress.entry_counts.enable = false

# 角色重新进入时间（秒）
# Characters re-entry time in seconds
# 默认值: 20 / Default: 20

gameserver.character.reentry.time = 3
