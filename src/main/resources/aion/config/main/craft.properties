# 制作配置

# 制作配置 / Craft config's:

# 启用制作技能无限制升级
# Enable craft skills unrestricted level-up
# 默认值: false / Default: false
gameserver.craft.skills.unrestricted.levelup.enable = false

# 启用“保护采集”
# Enable "Protection Gathering"
# 防止玩家在和平采集时遭遇“PvP 不文明行为”。
# This is prevent "Pvp Uncivilized" when a player want gather in peace.
# 该玩家对其他玩家变为“隐身”。
# The player become "Invisible" for other player.
# 默认值: false / Default: false
gameserver.protection.gather.enable = false

# 玩家可拥有的“制作专家”技能最大数量
# Maximum number of "Craft Expert" a player can have
# 默认值: 2 / Default: 2
gameserver.craft.max.expert.skills = 5

# 玩家可拥有的“制作大师”技能最大数量
# Maximum number of "Craft Master" a player can have
# 默认值: 1 / Default: 1
gameserver.craft.max.master.skills = 3

# 制作暴击几率（应用于第一步）
# Chance to have a critical procraft (applied on first step)

# 普通 / Regular
# 默认值: 15 / Default: 15
gameserver.craft.critical.rate.regular = 100

# 高级 / Premium
# 默认值: 15 / Default: 15
gameserver.craft.critical.rate.premium = 100

# VIP
# 默认值: 15 / Default: 15
gameserver.craft.critical.rate.vip = 100

# 制作连击几率（应用于第二步）
# Chance to have a combo procraft (applied on second step)

# 普通 / Regular
# 默认值: 25 / Default: 25
gameserver.craft.combo.rate.regular = 100

# 高级 / Premium
# 默认值: 25 / Default: 25
gameserver.craft.combo.rate.premium = 100

# VIP
# 默认值: 25 / Default: 25
gameserver.craft.combo.rate.vip = 100

# 制作采集与材料/变形 / Craft Gather and Substance/Morph

# 制作与采集暴击值
# Crit Values For Craft and Gather
# 默认值: 1 / Default: 1
gameserver.craft.chance.purple.crit = 100
# 默认值: 10 / Default: 10
gameserver.craft.chance.blue.crit = 100
# 默认值: 100 / Default: 100
gameserver.craft.chance.instant = 100
