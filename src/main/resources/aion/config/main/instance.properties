# 副本配置 / Instance configs

# 允许玩家不组队进入队伍、联盟或联合副本
# Allow players to enter party, alliance or league instances alone
gameserver.instance.allow_solo_entry = true

# 真端 SpecialServer_Cond 环境值：0=普通服务，1=特殊服务
# Retail SpecialServer_Cond environment: 0 = regular service, 1 = special service
gameserver.instance.special_server_cond = 0

# 冷却时间倍率：1 = 官服冷却，0.01 = 官服冷却的 1%，0 = 无冷却
# Cooldown multiplier: 1 = retail cooldown, 0.01 = 1% of retail cooldown, 0 = no cooldown
gameserver.instances.cooldown.rate = 1

# 不受上述冷却倍率影响的副本地图 ID
# Instance map IDs excluded from the cooldown rate
gameserver.instances.cooldown.filter =

# 空普通副本的销毁延迟（秒）
# Empty regular instance destroy delay in seconds
gameserver.instance.destroy_delay_seconds = 600

# 空单人副本的销毁延迟（秒）
# Empty solo instance destroy delay in seconds
gameserver.instance.solo.destroy_delay_seconds = 600

# 根据副本内玩家数量动态缩放 NPC 难度
# Scale NPC difficulty by the number of players in the instance
gameserver.instance.scaling.enable = false

# NPC 生命值的最低倍率
# Minimum NPC HP multiplier
gameserver.instance.scaling.hp_floor = 0.5

# NPC 伤害的最低倍率
# Minimum NPC damage multiplier
gameserver.instance.scaling.dmg_floor = 0.5

# 不启用动态缩放的副本地图 ID
# Instance map IDs excluded from difficulty scaling
gameserver.instance.scaling.excluded_maps =
