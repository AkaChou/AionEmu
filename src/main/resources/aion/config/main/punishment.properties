# 处罚相关配置:
# Punishment config's:

# 启用自动处罚
# Enable auto punishment
# 默认值: false / Default: false
gameserver.punishment.enable = false

# 处罚类型
# Punishment type
# 1 - 踢下线 / kick
# 2 - 封禁角色 / ban character
# 3 - 封禁账号 / ban account
# 4 - 封禁 IP / ban ip
# 5 - 封禁 MAC / ban mac
# 默认值: 1 / Default: 1
gameserver.punishment.type = 1

# 处罚时长（分钟）
# Punishment time in minutes
# 默认值: 1440（1 天） / Default: 1440 (1 day)
gameserver.punishment.time = 1440
