# 技能配置 / Skill configs

# 技能冷却系数，可选范围 0.01-1；1 = 原始冷却，0.01 = 原始冷却的 1/100
# Skill cooldown multiplier, range 0.01-1; 1 = original cooldown, 0.01 = 1/100 of original cooldown
gameserver.skill.cooldown.multiplier = 1

# DP 技能是否消耗 DP；false 时仍校验施放所需 DP，但不扣除 DP
# Whether DP skills consume DP; false still checks the required DP but does not deduct it
gameserver.skill.dp.consume = true

# 魔法增幅有效上限
# Magic boost effective cap
gameserver.magicboost.cap = 6500

# 持续伤害是否解除束缚
# Whether periodic damage breaks root effects
# 默认值: false / Default: false
gameserver.skill.root.break.on.dot = false
