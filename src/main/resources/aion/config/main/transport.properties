# 传送配置 / Transport config

# 据点传送读条时间（秒），0 表示立即完成读条
# Hotspot teleport cast time in seconds; 0 completes the cast immediately
gameserver.transport.hotspot.cast_time_seconds = 2

# 据点传送冷却时间（秒），0 表示无冷却
# Hotspot teleport cooldown in seconds; 0 disables the cooldown
gameserver.transport.hotspot.cooldown_seconds = 5
