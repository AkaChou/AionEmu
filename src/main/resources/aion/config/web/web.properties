# 管理控制台配置 / ADMIN CONSOLE CONFIGURATION
#
# 该文件不被遗留属性镜像机制收录（避免密码进入 Spring Environment），
# 由管理控制台在启动期直接读取。
# This file is not covered by the legacy property mirror (so the password stays out of the Spring
# Environment); the admin console reads it directly at startup.

# 是否启用管理控制台 / Whether the admin console is enabled
# 关闭时完全不启动 Web 层，游戏服行为与未接入控制台时完全一致。
# When disabled the web layer is not started at all, and the game server behaves exactly as before.
web.enabled = true

# 监听地址与端口 / Bind address and port
# 默认仅绑定回环地址。对外暴露前务必先修改 web.password。
# Binds the loopback address by default. Change web.password before exposing it.
web.address = 127.0.0.1
web.port = 8080

# 登录凭据 / Login credentials
# 默认账号与密码均为 aion，属于明示的安全取舍：控制台可修改 GM 权限等级与命令权限，
# 因此暴露到非本机地址前必须改掉默认密码。
# The default user name and password are both aion. This is a deliberate trade-off: the console can
# change GM access levels and command permissions, so the default password must be changed before the
# console is exposed beyond the local machine.
web.username = aion
web.password = aion

# 会话有效期（分钟）/ Session lifetime in minutes
web.session.timeout = 120
