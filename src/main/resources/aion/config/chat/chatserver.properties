# 聊天服务器配置 / Chat-server configuration

# 记录客户端的每个频道请求（调试用）
# log each channel request from client (debug purposes)
chatserver.log.channel.request = true

# 记录对无效频道的请求（调试用）
# Log requests to invalid channels (debug purposes)
chatserver.log.channel.invalid = true

# 是否记录聊天？ / Log chat?
chatserver.log.chat = true

# 聊天语言 / Lang Chat
# 1 = 英语 / English		7 = 瑞典语 / Swedish
# 2 = 法语 / French		8 = 芬兰语 / Finnish
# 3 = 德语 / German		9 = 挪威语 / Norwegian
# 4 = 意大利语 / Italian		10 = 希腊语 / Greek
# 5 = 西班牙语 / Spanish
# 6 = 丹麦语 / Danish
chatserver.chat.lang = 3

# 消息间隔（秒）。0 为禁用 / delay between messages. seconds. 0 to disable
# 强烈建议启用 / strongly recommended
chatserver.chat.message.delay = 30

# 指定聊天服务器重启频率 / Specifies the frequency the chat server will be restarted
# 选项: NEVER, DAILY, WEEKLY, MONTHLY / Options: NEVER, DAILY, WEEKLY, MONTHLY
# 默认值: NEVER / Default: NEVER
chatserver.restart.frequency = NEVER

# 指定服务器应在每天的具体时间重启（当然需遵循频率设置）
# Specifies the exact time of day the server should be restarted (of course respecting the frequency)
# 默认值: 5:00 / Default: 5:00
chatserver.restart.time = 5:00
