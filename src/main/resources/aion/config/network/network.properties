# 统一网络配置 / SHARED NETWORK CONFIGURATION

# 客户端入口 / CLIENT ENDPOINTS

# 登录服务器客户端入口 / Login-server client endpoint
loginserver.network.client.host = *
loginserver.network.client.port = 2106

# 游戏服务器客户端入口 / Game-server client endpoint
gameserver.network.client.host = *
gameserver.network.client.port = 7777
gameserver.network.client.maxplayers = 10

# 聊天服务器客户端监听地址 / Chat-server client bind address
chatserver.network.client.address = 0.0.0.0:10241

# 公网公布地址 / PUBLIC ADDRESSES

# 向游戏客户端公布的游戏服务器公网地址
# Public game-server address advertised to game clients
gameserver.network.address = 192.168.1.18

# 向游戏客户端公布的聊天服务器公网地址
# Public chat-server address advertised to game clients
chatserver.network.public.address = 192.168.1.18:10241

# 服务间内网通信 / INTERNAL SERVICE CONNECTIONS

# 登录服务器接收游戏服连接的内网监听地址
# Internal listener used by game servers to connect to the login server
loginserver.network.gameserver.host = 127.0.0.1
loginserver.network.gameserver.port = 9014

# 游戏服连接登录服的内网地址 / Internal login-server address used by the game server
gameserver.network.login.address = 127.0.0.1:9014

# 聊天服务器接收游戏服连接的内网地址
# Internal chat-server address used by game servers
chatserver.network.gameserver.address = 127.0.0.1:9021

# 服务认证 / SERVICE AUTHENTICATION

# 本游戏服务器 ID / Game-server ID
gameserver.network.login.gsid = 1

# 游戏服连接登录服的密码 / Password used by the game server to connect to the login server
gameserver.network.login.password = aion

# 游戏服连接聊天服的密码 / Password used by the game server to connect to the chat server
chatserver.network.gameserver.password = aion

# 登录连接保护 / LOGIN CONNECTION PROTECTION

# 玩家可尝试登录的次数，超过后因暴力破解被封禁
# Failed login attempts before brute-force protection bans the client
loginserver.network.client.logintrybeforeban = 5

# 因暴力破解被封禁的时长（分钟）/ Brute-force ban duration in minutes
loginserver.network.client.bantimeforbruteforcing = 15

# 合法重连时间（秒）/ Legal reconnection time in seconds
network.fastreconnection.time = 5

# 游戏服网络线程 / GAME-SERVER NETWORK THREADS

# 专用于读写网络数据的额外线程数
# Number of extra threads dedicated only to read/write network data.
# 值 < 1 表示接收线程同时处理读写
# Value < 1 means that acceptor thread will also handle read & write.
# 值 > 0 表示有 x 个专用读写线程 + 1 个接收线程
# Value > 0 means there will be x dedicated read/write threads + 1 acceptor.
gameserver.network.nio.threads = 1

# 用于执行客户端数据包的线程数（最小值）
# Minimum number of threads used to process client packets
gameserver.network.packet.processor.threads.min = 4

# 用于执行客户端数据包的线程数（最大值）
# Maximum number of threads used to process client packets
gameserver.network.packet.processor.threads.max = 4

# 数据包调试 / PACKET DIAGNOSTICS

# 是否显示未知数据包 / Display unknown packets
gameserver.network.display.unknownpackets = false

# 是否显示数据包 / Display packets
gameserver.network.display.packets = false

# 游戏服连接洪水保护 / GAME-SERVER CONNECTION FLOOD PROTECTION

# 是否启用连接洪水保护 / Enable connection flood protection
gameserver.network.flood.connections = false

# 洪水检测周期（毫秒）/ Flood detection tick in milliseconds
gameserver.network.flood.tick = 1000

# 短周期阈值 / Short-period thresholds
gameserver.network.flood.short.warn = 10
gameserver.network.flood.short.reject = 20
gameserver.network.flood.short.tick = 10

# 长周期阈值 / Long-period thresholds
gameserver.network.flood.long.warn = 30
gameserver.network.flood.long.reject = 60
gameserver.network.flood.long.tick = 60
