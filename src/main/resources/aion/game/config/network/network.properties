# ==========================================
# 		  网络配置 / NETWORK CONFIGURATIONS
# ==========================================

# 监听客户端连接的端口 / Port that will be used to listen for client connections
gameserver.network.client.port = 7777

# 监听客户端连接的主机地址 / Host that will be used to listen for client connections
gameserver.network.client.host = *

# 服务器最大在线玩家数 / Maximum online players on the server
gameserver.network.client.maxplayers = 10

# 游戏服务器公网地址。设置后会覆盖
# gameserver.network.login.address 中的主机以及默认的 ipconfig 地址。
# Public game server address. When set, it overrides the host in
# gameserver.network.login.address and the default ipconfig address.
gameserver.network.address = 192.168.1.18

# 登录服务器地址 / Address of login server.
# 若设置了 gameserver.network.address，则仅替换其中的主机，下方端口保持不变。
# If gameserver.network.address is set, only this host is replaced and the port below is kept.
gameserver.network.login.address = 192.168.1.18:9014

# 本游戏服务器 ID / Id of this game server
gameserver.network.login.gsid = 1

# 本游戏服务器密码 / Password of this game server
gameserver.network.login.password = aion

# 聊天服务器地址 / Address of chat server
# 聊天服务器的 IP 和端口应可从以下位置访问 / Ip and port of chat server should be accessible from
# 1) 游戏服务器 / game server
# 2) 所有已连接的客户端 / all connected clients
gameserver.network.chat.address = 127.0.0.1:9021

# 本游戏服务器用于连接聊天服务器的密码 / Password of this game server for chat server
gameserver.network.chat.password = aion

# 专用于读写网络数据的额外线程数
# Number of extra threads dedicated only to read/write network data.
# 值 < 1 表示接受线程同时处理读写
# Value < 1 means that acceptor thread will also handle read & write.
# 值 > 0 表示有 x 个专用读写线程 + 1 个接受线程
# Value > 0 means there will be x dedicated read/write threads + 1 acceptor.
gameserver.network.nio.threads = 1

# 用于执行客户端数据包的线程数（最小值）
# Number of threads (min) that will be used to execute client packets
gameserver.network.packet.processor.threads.min = 4

# 用于执行客户端数据包的线程数（最大值）
# Number of threads (max) that will be used to execute client packets
gameserver.network.packet.processor.threads.max = 4

# 决定何时终止数据包处理线程的阈值
# Threshold used to decide when packet processor thread should be killed
# 仅当最小线程数 ≠ 最大线程数时生效 / It have effect only if min threads != max threads
gameserver.network.packet.processor.threshold.kill = 3

# 决定何时额外生成数据包处理线程的阈值
# Threshold used to decide when extra packet processor thread should be spawned
# 仅当最小线程数 ≠ 最大线程数时生效 / It have effect only if min threads != max threads
gameserver.network.packet.processor.threshold.spawn = 50

# 启用或禁用未知数据包的消息输出 / This will enable or disable the messages for unknown packets
gameserver.network.display.unknownpackets = false

# 启用或禁用数据包的消息输出 / This will enable or disable the messages for packets
gameserver.network.display.packets = false

# 启用洪水保护 / Enable flood protector
gameserver.network.flood.connections = false

# 洪水检测 tick 毫秒数 / Flood ms in tick
gameserver.network.flood.tick = 1000

# 短周期 / Short period
gameserver.network.flood.short.warn = 10
gameserver.network.flood.short.reject = 20
gameserver.network.flood.short.tick = 10

# 长周期 / Long period
gameserver.network.flood.long.warn = 30
gameserver.network.flood.long.reject = 60
gameserver.network.flood.long.tick = 60
