# ==========================================
# 关机相关配置:
# Shutdown config's:
# ==========================================
# 注意：此设置仅适用于从控制台执行关机！
# NOTE: This settings is only if shutdown from console!

# 关机钩子模式。1 = 关机，2 = 重启。
# Shutdown hook mode. 1 = Shutdown, 2 = Restart.
# 默认值: 1 / Default: 1
gameserver.shutdown.mode = 1

# 关机钩子延迟。
# Shutdown hook delay.
# 默认值: 180 / Default: 180
gameserver.shutdown.delay = 180

# 关机公告间隔。
# Shutdown announce interval.
# 默认值: 1 / Default: 1
gameserver.shutdown.interval = 1

# 安全重启模式。
# This is a safe reboot mode.
# 注意：关机过程中所有操作均被禁用。
# NOTE: All action is disabled in shutdown progress.
# 默认值: true / Default: true
gameserver.shutdown.safereboot = true

# 注意：关机模式下会清除所有 NPC
# NOTE: Despawn all npcs in shoutdown mode
# 默认值: true / Default: true
gameserver.shutdown.despnpcs = true
