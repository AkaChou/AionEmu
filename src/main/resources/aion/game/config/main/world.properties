# ==========================================
# 世界相关配置:
# World config's:
# ==========================================

# 世界区域大小
# World region size
# 默认值: 128 / Default: 128
# 仅可使用: 64,128,256。使用其他值会导致 mapRegion 系统无法工作。
# Only use: 64,128,256 If use other value mapRegion system dont's work.
gameserver.world.region.size = 128

# 追踪活跃区域并停用非活跃区域
# Trace active regions and deactivate inactive
# 若为 false，所有区域中的 NPC AI 都会保持活跃
# If false - in all regions npcs ai will be active
# 默认值: true / Default: true
gameserver.world.region.active.trace = true

# 通过世界新手分线模拟 "A Station"（需启用 gameserver.world.max.twincount.beginner 才生效）
# Emulate "A Station" by using world beginner twins. Have to enable
# gameserver.world.max.twincount.beginner to make it working
# 默认值: false / Default: false
gameserver.world.emulate.a.station = false

# 普通地图最大分线数。设为 0 时使用 world_maps.xml 中的值
# Max number of usual twin count. If set to 0, values from world_maps.xml are used
# 默认值: 1 - 每张地图仅使用 1 条默认分线 / Default: 1 - only 1 default twin is used for each map
gameserver.world.max.twincount.usual = 1

# 新手地图最大分线数。设为 0 时使用 world_maps.xml 中的值
# Max number of beginners twin count. If set to 0, values from world_maps.xml are used
# 默认值: -1 - 禁用 / Default: -1 - disabled
gameserver.world.max.twincount.beginner = -1
