# ==========================================
# 		  管理员命令 / ADMIN COMMAND
# ==========================================

#  5 - 管理员 / Admin
#  4 - 首席GM / Head-GM
#  3 - GM
#  2 - 初级GM / Jr-GM
#  1 - 客服 / Support
#  0 - 玩家 / Player

# GM 面板 / GM Panel
# 默认值: 3 / Default: 3
gameserver.administration.gmpanel = 3

# GM 等级 / GM Level
# 默认值: 3 / Default: 3
gameserver.administration.gmlevel = 3

# 任意位置自由飞行 / Free Flight Everywhere
# 默认值: 3 / Default: 3
gameserver.administration.flight.freefly = 3

# GM 无限飞行时间 / Unlimited Flight Time for GM's
# 默认值: 3 / Default: 3
gameserver.administration.flight.unlimited = 3

# 无需钥匙即可打开任意门 / Open every door without using a key
# 默认值: 3 / Default: 3
gameserver.administration.doors.opening = 3

# 管理员自动复活 / Auto-Res for admins
# 默认值: 3 / Default: 3
gameserver.administration.auto.res = 5

# 禁用 GM 的副本进入限制 / Disable instance requirement for GMs
# 默认值: 3 / Default: 3
gameserver.administration.instancereq = 0

# 可查看玩家详细信息 / Can view player details
# 默认值: 3 / Default: 3
gameserver.administration.view.player = 5

# ==========================================
# 管理员选项 / Admin Options:
# ==========================================
# 启用以 GM 模式登录 / Enable GM login in GM mode
# 默认值: false / Default: false
gameserver.administration.gm.mode.connection = false

# 启用以隐身模式登录 / Enable GM login in invisible mode
# 默认值: false / Default: false
gameserver.administration.invis.gm.connection = false

# GM 登录时的敌对状态（可选值: Normal, Neutral, Enemy；其他值视为 Normal）
# GM enemity state on login (Values: Normal, Neutral, Enemy; Anything else will stand for Normal)
# 默认值: Neutral / Default: Neutral
gameserver.administration.enemity.gm.connection = Normal

# 启用以无敌模式登录 / Enable GM login in invulnerable mode
# 默认值: false / Default: false
gameserver.administration.invul.gm.connection = false

# 启用以视野增强模式登录 / Enable GM login vision mode
# 默认值: false / Default: false
gameserver.administration.vision.gm.connection = false

# 禁用 GM 密语 / Disable GM whisper
# 默认值: false / Default: false
gameserver.administration.whisper.gm.connection = true

# ==========================================
# GM 标签配置 / GM Tag config's:
# ==========================================
# 警告：启用后其他玩家将无法通过游戏界面邀请组队等！
# Warning: Other players will be unable to invite to group, etc. using game visual interface!
# 启用后，每个权限等级会在玩家名称前显示不同标签
# When enabled each access level will display a different tag before player name
# 默认值: false / Default: false
gameserver.admin.tag.enable = true

# 权限等级 1 的自定义标签 / Custom tag for access level 1
# 默认值: <Support> / Default: <Support>
gameserver.admin.tag.1 = \uE042 Support \uE043 %s

# 权限等级 2 的自定义标签 / Custom tag for access level 2
# 默认值: <Jr-GM> / Default: <Jr-GM>
gameserver.admin.tag.2 = \uE042 Jr-GM \uE043 %s

# 权限等级 3 的自定义标签 / Custom tag for access level 3
# 默认值: <GM> / Default: <GM>
gameserver.admin.tag.3 = \uE042 GM \uE043 %s

# 权限等级 4 的自定义标签 / Custom tag for access level 4
# 默认值: <Head-GM> / Default: <Head-GM>
gameserver.admin.tag.4 = \uE042 Head-GM \uE043 %s

# 权限等级 5 的自定义标签 / Custom tag for access level 5
# 默认值: <Admin> / Default: <Admin>
gameserver.admin.tag.5 = \uE050 Admin \uE050 %s
# 启用物品交易限制 / Enable item restriction
gameserver.administration.trade.item.restriction = false

# GM 进入世界时的公告 / Enter world announce for gms
# * - 全部公告 / announce all of them
# 1,2,3,4 等 - 仅公告对应等级的 GM / announce only gms with that level
gameserver.admin.announce.levels = *

# ==========================================
# 管理员特殊技能 / SPECIAL SKILLS ADMIN
# ==========================================
gameserver.administration.gmskills = 5
