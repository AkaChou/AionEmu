spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/aion_emu?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&useLegacyDatetimeCode=false&serverTimezone=UTC
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 20
      max-lifetime: 600000
      connection-test-query: SELECT 1
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  main:
    banner-mode: "off"
    log-startup-info: false
    web-application-type: none
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

aion:
  game:
    startup:
      progress:
        enabled: true
  services:
    game:
      enabled: true
    login:
      enabled: true
    chat:
      enabled: true
    transport:
      mode: netty
