spring:
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  main:
    banner-mode: "off"
    log-startup-info: false
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
mybatis-flex:
  global-config:
    print-banner: false

aion:
  game:
    startup:
      progress:
        enabled: true
  services:
    game:
      enabled: true
    login:
      enabled: true
    chat:
      enabled: true
    transport:
      mode: netty
